site_name: Citron Wiki
site_description: Official documentation for the Citron Minecraft modpack.
site_url: https://precisionzero.github.io/citron-wiki/
repo_url: https://github.com/PrecisionZero/citron-wiki
repo_name: PrecisionZero/citron-wiki
edit_uri: edit/main/docs/
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  custom_dir: docs/overrides
extra_css:
  - assets/stylesheets/citron.css
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
plugins:
  - search
nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - First Launch: getting-started/first-launch.md
      - Updating: getting-started/updating.md
  - Features:
      - Overview: features/index.md
      - Performance: features/performance.md
      - Quality of Life: features/quality-of-life.md
      - Visual Features: features/visual-features.md
      - Citron Menu: features/main-menu.md
      - Included Mods: features/mods.md
  - Configuration:
      - Overview: configuration/index.md
      - Controls and Keybinds: configuration/controls.md
      - Performance Settings: configuration/performance.md
      - Visual Settings: configuration/visuals.md
  - Compatibility:
      - Overview: compatibility/index.md
  - Troubleshooting:
      - Overview: troubleshooting/index.md
      - Launch and Crashes: troubleshooting/launch-crashes.md
      - Performance: troubleshooting/performance.md
      - Graphics and UI: troubleshooting/graphics-ui.md
      - Reading Logs: troubleshooting/logs.md
  - Help and Reference:
      - FAQ: faq.md
      - Glossary: glossary.md
      - Reporting an Issue: support/issue-reporting.md
      - Versioning: versioning.md
      - Contributing: contributing.md
