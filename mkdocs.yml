site_name: Citron Wiki
site_description: Documentation for Citron.
site_url: https://precisionzero.github.io/citron-wiki/
repo_url: https://github.com/PrecisionZero/citron-wiki
repo_name: PrecisionZero/citron-wiki
edit_uri: edit/main/pages/
docs_dir: pages
site_dir: site
exclude_docs: _templates/**
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra_css:
  - assets/citron.css
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
plugins:
  - search
nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - First Launch: getting-started/first-launch.md
      - Updating: getting-started/updating.md
  - Citron Versions:
      - All Versions: versions/index.md
      - 1.0.0 (Development):
          - Overview: versions/1.0.0/index.md
          - 1.0.0-dev.8: versions/1.0.0/dev-8.md
          - 1.0.0-dev.7: versions/1.0.0/dev-7.md
          - 1.0.0-dev.6: versions/1.0.0/dev-6.md
          - 1.0.0-dev.5: versions/1.0.0/dev-5.md
          - 1.0.0-dev.4: versions/1.0.0/dev-4.md
          - 1.0.0-dev.3: versions/1.0.0/dev-3.md
          - 1.0.0-dev.2: versions/1.0.0/dev-2.md
          - 1.0.0-dev.1: versions/1.0.0/dev-1.md
  - Features: features/index.md
  - Help:
      - Overview: help/index.md
      - FAQ: help/faq.md
      - Troubleshooting: help/troubleshooting.md
      - Report an Issue: help/report-issue.md
