site_name: Citron Wiki
site_description: Guides and reference for the Citron Minecraft modpack.
site_url: https://precisionzero.github.io/citron-wiki/
repo_url: https://github.com/PrecisionZero/citron-wiki
repo_name: PrecisionZero/citron-wiki
edit_uri: edit/main/docs/
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra_css:
  - assets/stylesheets/citron.css
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
plugins:
  - search
nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - First Launch: getting-started/first-launch.md
      - Updating: getting-started/updating.md
  - Features:
      - Overview: features/index.md
      - Performance: features/performance.md
      - Quality of Life: features/quality-of-life.md
      - Visual Features: features/visual-features.md
      - Citron Menu: features/main-menu.md
      - Included Mods: features/mods.md
  - Settings:
      - Overview: configuration/index.md
      - Controls: configuration/controls.md
      - Performance: configuration/performance.md
      - Visuals: configuration/visuals.md
  - Compatibility: compatibility/index.md
  - Troubleshooting:
      - Overview: troubleshooting/index.md
      - Launch & Crashes: troubleshooting/launch-crashes.md
      - Performance: troubleshooting/performance.md
      - Graphics & UI: troubleshooting/graphics-ui.md
      - Logs: troubleshooting/logs.md
  - Reference:
      - FAQ: faq.md
      - Glossary: glossary.md
      - Report an Issue: support/issue-reporting.md
      - Versioning: versioning.md
      - Edit the Wiki: contributing.md
